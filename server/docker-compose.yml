version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      POSTGRES_DB: ${GRAVITY_POSTGRES_DB:-gravity_workspace}
      POSTGRES_USER: ${GRAVITY_POSTGRES_USER:-gravity_user}
      POSTGRES_PASSWORD: ${GRAVITY_POSTGRES_PASSWORD:?Set GRAVITY_POSTGRES_PASSWORD in ../.env}
    entrypoint: ["/bin/sh", "/usr/local/bin/gravity-start-service", "postgres"]
    volumes:
      - gravity_postgres_data:/var/lib/postgresql/data
      - ../scripts/docker/start-service.sh:/usr/local/bin/gravity-start-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${GRAVITY_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    networks:
      - gravity_backend_db_redis

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: /data/rustfs --console-enable
    entrypoint: ["/bin/sh", "/usr/local/bin/gravity-start-service", "rustfs"]
    user: "0:0"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in ../.env}
    volumes:
      - gravity_rustfs_data:/data/rustfs
      - gravity_rustfs_logs:/logs
      - ../scripts/docker/start-service.sh:/usr/local/bin/gravity-start-service:ro
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -s http://localhost:9000/ >/dev/null && curl -s http://localhost:9001/ >/dev/null"]
      interval: 10s
      start_period: 20s
      timeout: 5s
      retries: 12
    ports:
      - "${GRAVITY_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_PORT:-9000}:9000"
      - "${GRAVITY_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    networks:
      - gravity_backend_db_redis

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GRAVITY_REDIS_PASSWORD: ${GRAVITY_REDIS_PASSWORD:?Set GRAVITY_REDIS_PASSWORD in ../.env}
    entrypoint: ["/bin/sh", "/usr/local/bin/gravity-start-service", "redis"]
    volumes:
      - ../scripts/docker/start-service.sh:/usr/local/bin/gravity-start-service:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$GRAVITY_REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${GRAVITY_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    networks:
      - gravity_backend_db_redis

volumes:
  gravity_postgres_data:
  gravity_rustfs_data:
  gravity_rustfs_logs:

networks:
  gravity_backend_db_redis:
    driver: bridge
    internal: true
