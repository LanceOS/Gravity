name: Build and publish server Docker image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'library/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - 'docker/**'
      - 'scripts/docker/**'
      - '.github/workflows/docker-publish.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gravity
          POSTGRES_PASSWORD: smoke-only
          POSTGRES_DB: gravity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gravity"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build server image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: gravity-smoke:server-${{ matrix.arch }}
      - name: Build frontend image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: gravity-smoke:client-${{ matrix.arch }}
      # Lifecycle commands below run only on this disposable GitHub runner.
      - name: Start real image entrypoints against disposable services
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run -d --name gravity-server-smoke --platform "linux/$ARCH" --network host \
            -e DATABASE_URL=postgres://gravity:smoke-only@127.0.0.1:5432/gravity \
            -e BETTER_AUTH_SECRET=ci-smoke-only-secret-with-at-least-32-characters \
            -e NODE_IDENTITY_MASTER_KEY=ci-smoke-only-identity-key-with-at-least-32-characters \
            -e REDIS_ENABLED=true -e REDIS_URL=redis://127.0.0.1:6379 \
            "gravity-smoke:server-$ARCH"
          docker run -d --name gravity-client-smoke --platform "linux/$ARCH" --network host \
            -e BACKEND_UPSTREAM=http://127.0.0.1:8080 "gravity-smoke:client-$ARCH"
      - name: Check startup and actual compiled assets
        run: node scripts/docker/smoke-image.mjs
      - name: Capture logs
        if: always()
        run: |
          docker logs gravity-server-smoke
          docker logs gravity-client-smoke
      - name: Save the exact tested server image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "gravity-smoke:server-$ARCH" -o "${{ runner.temp }}/server-$ARCH.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: ${{ runner.temp }}/server-${{ matrix.arch }}.tar
          retention-days: 1
          compression-level: 0

  publish:
    # No registry writes until every architecture passes; do not rebuild here.
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images and multi-architecture tags
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_DIR: ${{ runner.temp }}/images
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY_OWNER,,}/gravity-app"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          for arch in amd64 arm64; do
            docker load -i "$IMAGE_DIR/server-$arch.tar"
            docker tag "gravity-smoke:server-$arch" "$image:$GITHUB_SHA-$GITHUB_RUN_ID-$arch"
            docker push "$image:$GITHUB_SHA-$GITHUB_RUN_ID-$arch"
          done
          docker buildx imagetools create \
            -t "$image:latest" -t "$image:$version" -t "$image:$GITHUB_SHA" \
            "$image:$GITHUB_SHA-$GITHUB_RUN_ID-amd64" "$image:$GITHUB_SHA-$GITHUB_RUN_ID-arm64"
