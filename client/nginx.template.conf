server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    # React uses style attributes extensively; CSP3 permits those without allowing inline <style> blocks.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; trusted-types dompurify ProseMirrorClipboard; require-trusted-types-for 'script'" always;
    try_files $uri $uri/ /index.html;
  }

  location /api {
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass ${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
