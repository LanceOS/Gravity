server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    # React uses style attributes extensively; CSP3 permits those without allowing inline <style> blocks.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; trusted-types gravity-editor dompurify ProseMirrorClipboard; require-trusted-types-for 'script'; report-uri /api/v1/csp-reports" always;
    try_files $uri $uri/ /index.html;
  }

  # Browser reports may contain page URLs and samples in their request bodies.
  # Keep this path out of the access log and do not forward client IP headers.
  location = /api/v1/csp-reports {
    access_log off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass ${BACKEND_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
  }

  location /api {
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass ${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # MCP OAuth discovery and SDK authorization endpoints live at the origin root.
  # The browser consent page at /oauth/consent still uses the SPA fallback.
  location ~ ^/(\.well-known/oauth-(authorization-server|protected-resource)(/.*)?|authorize|token|register|revoke)$ {
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass ${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
