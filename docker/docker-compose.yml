services:
  postgres:
    image: postgres:16-alpine
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      POSTGRES_USER: ${GRAVITY_POSTGRES_USER:-gravity_user}
      POSTGRES_PASSWORD: ${GRAVITY_POSTGRES_PASSWORD:?Set GRAVITY_POSTGRES_PASSWORD in ../.env}
      POSTGRES_DB: ${GRAVITY_POSTGRES_DB:-gravity_workspace}
    entrypoint: ["/bin/sh", "/usr/local/bin/gravity-start-service", "postgres"]
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/docker/start-service.sh:/usr/local/bin/gravity-start-service:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GRAVITY_POSTGRES_USER:-gravity_user} -d ${GRAVITY_POSTGRES_DB:-gravity_workspace}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gravity_internal

  redis:
    image: redis:7-alpine
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      GRAVITY_REDIS_PASSWORD: ${GRAVITY_REDIS_PASSWORD:?Set GRAVITY_REDIS_PASSWORD in ../.env}
    entrypoint: ["/bin/sh", "/usr/local/bin/gravity-start-service", "redis"]
    volumes:
      - ../scripts/docker/start-service.sh:/usr/local/bin/gravity-start-service:ro
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$GRAVITY_REDIS_PASSWORD\" redis-cli ping"]
      timeout: 5s
      retries: 5
    networks:
      - gravity_internal

  rustfs:
    image: rustfs/rustfs:latest
    env_file:
      - ../.env
    restart: unless-stopped
    command: /data/rustfs --console-enable
    user: "0:0"
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in ../.env}
    volumes:
      - gravity_rustfs_data:/data/rustfs
      - gravity_rustfs_logs:/logs
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gravity_internal

  backend:
    build:
      context: ..
      dockerfile: server/Dockerfile
    # Use the consolidated repository-level .env
    env_file:
      - ../.env
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in ../.env}
      NODE_IDENTITY_MASTER_KEY: ${NODE_IDENTITY_MASTER_KEY:?Set NODE_IDENTITY_MASTER_KEY in ../.env}
      DATABASE_URL: postgresql://${GRAVITY_POSTGRES_USER:-gravity_user}:${GRAVITY_POSTGRES_PASSWORD:?Set GRAVITY_POSTGRES_PASSWORD in ../.env}@postgres:5432/${GRAVITY_POSTGRES_DB:-gravity_workspace}
      REDIS_URL: redis://default:${GRAVITY_REDIS_PASSWORD:?Set GRAVITY_REDIS_PASSWORD in ../.env}@redis:6379
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-${GRAVITY_FRONTEND_PUBLIC_URL:-http://localhost:5173}}
      CORS_ORIGINS: ${CORS_ORIGINS:-${GRAVITY_FRONTEND_PUBLIC_URL:-http://localhost:5173}}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-${GRAVITY_FRONTEND_PUBLIC_URL:-http://localhost:5173}}
      NODE_ENV: ${NODE_ENV:-production}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://rustfs:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in ../.env}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-notes}
      OBJECT_STORAGE_REQUIRED: ${OBJECT_STORAGE_REQUIRED:-true}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-false}
      PORT: ${GRAVITY_BACKEND_PORT:-8080}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/api/v1/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      start_period: 60s
      retries: 6
    expose:
      - "8080"
    volumes:
      - gravity_backend_data:/data/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - gravity_internal

  frontend:
    build:
      context: ..
      dockerfile: client/Dockerfile
    environment:
      BACKEND_UPSTREAM: http://backend:8080
    ports:
      - "${GRAVITY_BIND_ADDRESS:-127.0.0.1}:${GRAVITY_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gravity_internal

volumes:
  pgdata:
  gravity_rustfs_data:
  gravity_backend_data:
  gravity_rustfs_logs:

networks:
  gravity_internal:
    internal: true
    driver: bridge
